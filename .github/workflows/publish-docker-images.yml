name: Publish Docker images

on:
  push:
    branches: [main]
    paths:
      - '.dockerignore'
      - '.github/workflows/publish-docker-images.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'Dockerfile'
      - 'scripts/arqen-bump-patch-version.py'
      - 'scripts/arqen-openbao-image-smoke.sh'
      - 'src/**'
      - 'deploy/containers/openbao/Dockerfile'
      - 'deploy/containers/openbao/config.hcl'
      - 'deploy/containers/openbao/policy-control.hcl'
      - 'deploy/containers/openbao/policy-broker.hcl'
      - 'deploy/containers/openbao/bootstrap.sh'
      - 'deploy/containers/openbao/start.sh'
permissions: {}

concurrency:
  group: arqen-image-release
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.value }}
      source_sha: ${{ steps.version.outputs.source_sha }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          source_sha="$GITHUB_SHA"

          version="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'Cargo.toml package version must be a stable X.Y.Z value.' >&2
            exit 1
          fi
          lock_version="$(python3 -c 'import tomllib; print(next(package["version"] for package in tomllib.load(open("Cargo.lock", "rb"))["package"] if package["name"] == "arqen"))')"
          if [[ "$version" != "$lock_version" ]]; then
            echo 'Cargo.toml and Cargo.lock package versions must match.' >&2
            exit 1
          fi

          git fetch origin --tags
          version_bumped=false
          tag="v$version"
          while git rev-parse --verify --quiet "refs/tags/$tag" >/dev/null; do
            tagged_commit="$(git rev-parse "$tag^{commit}")"
            if [[ "$tagged_commit" == "$GITHUB_SHA" && "$version_bumped" == false ]]; then
              break
            fi
            if ! git merge-base --is-ancestor "$tagged_commit" "$GITHUB_SHA"; then
              echo "Release tag $tag belongs to another history ($tagged_commit); refusing to choose a version automatically." >&2
              exit 1
            fi
            version="$(python3 "$GITHUB_WORKSPACE/scripts/arqen-bump-patch-version.py" --root "$GITHUB_WORKSPACE")"
            version_bumped=true
            tag="v$version"
          done

          if [[ "$version_bumped" == true ]]; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add Cargo.toml Cargo.lock
            git commit -m "Bump patch version to $version"
            git push origin HEAD:refs/heads/main
            source_sha="$(git rev-parse HEAD)"
          fi

          {
            echo "value=$version"
            echo "source_sha=$source_sha"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: validate
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.source_sha }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push MCP image for ${{ matrix.platform }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          target: mcp
          platforms: ${{ matrix.platform }}
          push: true
          tags: ghcr.io/operator-syn/arqen-mcp:sha-${{ needs.validate.outputs.source_sha }}-${{ matrix.arch }}
          cache-from: type=gha,scope=arqen-mcp-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=arqen-mcp-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.validate.outputs.version }}
            org.opencontainers.image.revision=${{ needs.validate.outputs.source_sha }}

      - name: Build and push shared control and broker runtime image for ${{ matrix.platform }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          target: runtime
          platforms: ${{ matrix.platform }}
          push: true
          tags: ghcr.io/operator-syn/arqen-runtime:sha-${{ needs.validate.outputs.source_sha }}-${{ matrix.arch }}
          cache-from: type=gha,scope=arqen-runtime-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=arqen-runtime-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.validate.outputs.version }}
            org.opencontainers.image.revision=${{ needs.validate.outputs.source_sha }}

      - name: Build and push project OpenBao image for ${{ matrix.platform }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/containers/openbao/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: ghcr.io/operator-syn/arqen-openbao:sha-${{ needs.validate.outputs.source_sha }}-${{ matrix.arch }}
          cache-from: type=gha,scope=arqen-openbao-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=arqen-openbao-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.validate.outputs.version }}
            org.opencontainers.image.revision=${{ needs.validate.outputs.source_sha }}

      - name: Smoke test project OpenBao image on ${{ matrix.platform }}
        run: >-
          bash scripts/arqen-openbao-image-smoke.sh
          ghcr.io/operator-syn/arqen-openbao:sha-${{ needs.validate.outputs.source_sha }}-${{ matrix.arch }}

  publish:
    needs: [validate, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    outputs:
      mcp_digest: ${{ steps.manifests.outputs.mcp_digest }}
      runtime_digest: ${{ steps.manifests.outputs.runtime_digest }}
      openbao_digest: ${{ steps.manifests.outputs.openbao_digest }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.source_sha }}
          fetch-depth: 0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish multi-platform image indexes
        id: manifests
        shell: bash
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          SOURCE_SHA: ${{ needs.validate.outputs.source_sha }}
        run: |
          set -euo pipefail
          mcp_image=ghcr.io/operator-syn/arqen-mcp
          runtime_image=ghcr.io/operator-syn/arqen-runtime
          openbao_image=ghcr.io/operator-syn/arqen-openbao

          publish_index() {
            local image="$1"
            docker buildx imagetools create \
              --tag "$image:$VERSION" \
              --tag "$image:latest" \
              "$image:sha-$SOURCE_SHA-amd64" \
              "$image:sha-$SOURCE_SHA-arm64"
          }
          publish_index "$mcp_image"
          publish_index "$runtime_image"
          publish_index "$openbao_image"

          mcp_digest="$(docker buildx imagetools inspect --raw "$mcp_image:$VERSION" | sha256sum | awk '{print "sha256:" $1}')"
          runtime_digest="$(docker buildx imagetools inspect --raw "$runtime_image:$VERSION" | sha256sum | awk '{print "sha256:" $1}')"
          openbao_digest="$(docker buildx imagetools inspect --raw "$openbao_image:$VERSION" | sha256sum | awk '{print "sha256:" $1}')"
          {
            echo "mcp_digest=$mcp_digest"
            echo "runtime_digest=$runtime_digest"
            echo "openbao_digest=$openbao_digest"
          } >> "$GITHUB_OUTPUT"

      - name: Tag the stable source release
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          SOURCE_SHA: ${{ needs.validate.outputs.source_sha }}
        run: |
          set -euo pipefail
          git fetch origin --tags
          tag="v$VERSION"
          if git rev-parse --verify --quiet "refs/tags/$tag" >/dev/null; then
            tagged_commit="$(git rev-parse "$tag^{commit}")"
            if [[ "$tagged_commit" != "$SOURCE_SHA" ]]; then
              echo "Release tag $tag already points to a different source commit." >&2
              exit 1
            fi
          else
            git tag "$tag" "$SOURCE_SHA"
            git push origin "refs/tags/$tag"
          fi

      - name: Update metadata-only docker-images branch
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          MCP_DIGEST: ${{ steps.manifests.outputs.mcp_digest }}
          RUNTIME_DIGEST: ${{ steps.manifests.outputs.runtime_digest }}
          OPENBAO_DIGEST: ${{ steps.manifests.outputs.openbao_digest }}
          SOURCE_SHA: ${{ needs.validate.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          metadata_worktree="$(mktemp -d)"
          rmdir "$metadata_worktree"
          git fetch origin docker-images:refs/remotes/origin/docker-images || true
          git worktree add --detach "$metadata_worktree" "$SOURCE_SHA"
          if git show-ref --verify --quiet refs/remotes/origin/docker-images; then
            git -C "$metadata_worktree" switch --detach origin/docker-images
          else
            git -C "$metadata_worktree" switch --orphan docker-images
            git -C "$metadata_worktree" rm -rf --ignore-unmatch .
            # Orphan checkout leaves source files untracked in this temporary worktree.
            git -C "$metadata_worktree" clean -fd
          fi
          git -C "$metadata_worktree" config user.name github-actions[bot]
          git -C "$metadata_worktree" config user.email 41898282+github-actions[bot]@users.noreply.github.com
          mkdir -p "$metadata_worktree/releases"
          METADATA_FILE="$metadata_worktree/releases/$VERSION.json" \
          python3 <<'PY'
          import json
          import os
          from pathlib import Path

          version = os.environ["VERSION"]
          metadata = {
              "version": version,
              "channel": "stable",
              "source_commit": os.environ["SOURCE_SHA"],
              "images": {
                  "mcp": {
                      "reference": f"ghcr.io/operator-syn/arqen-mcp:{version}",
                      "digest": os.environ["MCP_DIGEST"],
                      "platforms": ["linux/amd64", "linux/arm64"],
                  },
                  "runtime": {
                      "reference": f"ghcr.io/operator-syn/arqen-runtime:{version}",
                      "digest": os.environ["RUNTIME_DIGEST"],
                      "platforms": ["linux/amd64", "linux/arm64"],
                  },
                  "openbao": {
                      "reference": f"ghcr.io/operator-syn/arqen-openbao:{version}",
                      "digest": os.environ["OPENBAO_DIGEST"],
                      "platforms": ["linux/amd64", "linux/arm64"],
                  },
              },
              "pull": [
                  f"docker pull ghcr.io/operator-syn/arqen-mcp:{version}",
                  f"docker pull ghcr.io/operator-syn/arqen-runtime:{version}",
                  f"docker pull ghcr.io/operator-syn/arqen-openbao:{version}",
              ],
              "source_tag": f"v{version}",
          }
          Path(os.environ["METADATA_FILE"]).write_text(
              json.dumps(metadata, indent=2) + "\n", encoding="utf-8"
          )
          PY

          update_latest=true
          if [[ -s "$metadata_worktree/latest.json" ]]; then
            if python3 - "$metadata_worktree/latest.json" "$VERSION" <<'PY'
          import json
          import sys
          with open(sys.argv[1], encoding="utf-8") as stream:
              latest = json.load(stream)["version"]
          current = sys.argv[2]
          raise SystemExit(0 if tuple(map(int, latest.split("."))) > tuple(map(int, current.split("."))) else 1)
          PY
            then
              update_latest=false
            fi
          fi
          if [[ "$update_latest" == true ]]; then
            cp "$metadata_worktree/releases/$VERSION.json" "$metadata_worktree/latest.json"
          fi
          cat > "$metadata_worktree/README.md" <<'EOF'
          # Arqen image release index

          This branch contains release metadata only. Image layers are published
          to GHCR and are not stored here.

          - `latest.json` identifies the most recently published stable image release.
          - `releases/<version>.json` records immutable references, digests,
            source commit, platforms, and pull commands for each release.
          - `ghcr.io/operator-syn/arqen-runtime` is shared by the control and
            broker services; `ghcr.io/operator-syn/arqen-mcp` serves MCP; and
            `ghcr.io/operator-syn/arqen-openbao` bootstraps project OpenBao.
          EOF
          git -C "$metadata_worktree" add README.md "releases/$VERSION.json"
          if [[ -f "$metadata_worktree/latest.json" ]]; then
            git -C "$metadata_worktree" add latest.json
          fi
          if ! git -C "$metadata_worktree" diff --cached --quiet; then
            git -C "$metadata_worktree" commit -m "Publish stable image metadata for $VERSION"
            git -C "$metadata_worktree" push origin HEAD:docker-images
          else
            echo "Image metadata for v$VERSION is already present."
          fi
          git worktree remove "$metadata_worktree"

      - name: Increment patch version after successful publication
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          bump_worktree="$(mktemp -d)"
          rmdir "$bump_worktree"
          git worktree add --detach "$bump_worktree" origin/main
          current="$(python3 -c 'import tomllib,sys; print(tomllib.load(open(sys.argv[1], "rb"))["package"]["version"])' "$bump_worktree/Cargo.toml")"
          if [[ "$current" == "$VERSION" ]]; then
            next="$(python3 "$GITHUB_WORKSPACE/scripts/arqen-bump-patch-version.py" --root "$bump_worktree")"
            git -C "$bump_worktree" config user.name github-actions[bot]
            git -C "$bump_worktree" config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git -C "$bump_worktree" add Cargo.toml Cargo.lock
            git -C "$bump_worktree" commit -m "Bump patch version to $next"
            git -C "$bump_worktree" push origin HEAD:main
          else
            echo "main is already prepared for a later version ($current); leaving its manual version unchanged."
          fi
          git worktree remove "$bump_worktree"
