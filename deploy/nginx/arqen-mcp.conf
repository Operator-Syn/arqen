# Example only. Replace the host name and certificate paths before use.
# Nginx terminates public HTTPS; the Rust MCP process listens on loopback HTTP.

limit_req_zone $binary_remote_addr zone=arqen_mcp:10m rate=15r/s;

server {
    listen 443 ssl;
    server_name mcp.example.invalid;

    ssl_certificate /etc/letsencrypt/live/mcp.example.invalid/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mcp.example.invalid/privkey.pem;

    client_max_body_size 1m;

    location /mcp {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        limit_req zone=arqen_mcp burst=20 nodelay;
    }

    location /healthz {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

