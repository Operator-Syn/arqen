[package]
name = "arqen"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"

[dependencies]
arboard = "3"
anyhow = "1"
base64 = "0.22"
crossterm = "0.28"
keyring = "3"
ratatui = "0.29"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
url = "2"
uuid = { version = "1", features = ["v4"] }
