[package]
name = "arqen"
version = "0.1.5"
edition = "2024"
rust-version = "1.97"
license = "MPL-2.0"

[dependencies]
arboard = { version = "3", features = ["wayland-data-control"] }
anyhow = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "ws"] }
base64 = "0.22"
crossterm = "0.29"
ratatui = "0.30.2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
rmcp = { version = "=3.3.0", default-features = false, features = ["macros", "server", "transport-streamable-http-server"] }
futures-util = "0.3"
sha2 = "0.10"
signal-hook = "0.3"
subtle = "2"
url = "2"
uuid = { version = "1", features = ["v4"] }
libc = "0.2"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
tokio-tungstenite = "0.29"
html2text = "0.17.1"
encoding_rs = "0.8"

[dependencies.keyring]
version = "3"
default-features = false
features = [
    "apple-native",
    "windows-native",
    "linux-native-sync-persistent",
]
