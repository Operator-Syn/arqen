# Optional host clipboard integration for the published-image stack.
# Start Compose through compose-wayland.sh so these values match the desktop.
services:
  arqen-oauth-client-init:
    cap_add: [FOWNER]
    command:
      - >-
        install -d -m 0700 -o ${ARQEN_WAYLAND_UID} -g ${ARQEN_WAYLAND_GID} /run/arqen-oauth;
        install -m 0400 -o ${ARQEN_WAYLAND_UID} -g ${ARQEN_WAYLAND_GID}
        /run/secrets/google-client-secret /run/arqen-oauth/google-client-secret.json

  arqen-wayland-permissions:
    image: ghcr.io/operator-syn/arqen-runtime:${ARQEN_DOCKER_IMAGE_TAG:-latest}
    pull_policy: always
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - >-
        chown -R ${ARQEN_WAYLAND_UID}:${ARQEN_WAYLAND_GID} /var/lib/arqen /run/arqen
    volumes:
      - arqen-data:/var/lib/arqen
      - arqen-runtime:/run/arqen
    network_mode: none
    restart: "no"
    user: "0:0"
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE]
    security_opt: [no-new-privileges:true]

  arqen-broker:
    user: "${ARQEN_WAYLAND_UID}:${ARQEN_WAYLAND_GID}"
    group_add:
      - "0"
    depends_on:
      arqen-wayland-permissions:
        condition: service_completed_successfully

  arqen-mcp:
    user: "${ARQEN_WAYLAND_UID}:${ARQEN_WAYLAND_GID}"
    group_add:
      - "0"

  arqen-control:
    user: "${ARQEN_WAYLAND_UID}:${ARQEN_WAYLAND_GID}"
    group_add:
      - "0"
    environment:
      XDG_RUNTIME_DIR: /run/arqen-display
      WAYLAND_DISPLAY: "${ARQEN_WAYLAND_DISPLAY_NAME:-wayland-0}"
      ARQEN_GMAIL_BROKER_SOCKET: /run/arqen/gmail-broker.sock
    volumes:
      - arqen-runtime:/run/arqen:ro
      # Bind the session runtime DIRECTORY, never the Wayland socket leaf.
      #   * the directory exists from boot (lingering user manager), so Docker
      #     always has a valid bind source and creates nothing;
      #     create_host_path:false enforces that even if it is absent
      #   * a directory bind is a live view, so the socket appears once the
      #     session starts; a leaf bind pins the socket inode and goes stale
      #     whenever the compositor recreates it
      #   * control-gateway does not use Wayland at startup - only the in-TUI
      #     wl-copy/wl-paste helpers do - so a pre-session start is harmless
      # Binding the leaf with a Docker restart policy is a login-breaking bug:
      # Docker starts unless-stopped containers before any login, Compose then
      # creates the missing leaf as a root-owned directory, and the compositor
      # can no longer bind its socket ("Could not create wayland socket"), so
      # the user cannot get past the login screen.
      - type: bind
        source: "${ARQEN_WAYLAND_RUNTIME_DIR}"
        target: /run/arqen-display
        bind:
          create_host_path: false
    depends_on:
      arqen-wayland-permissions:
        condition: service_completed_successfully
    # Safe to auto-start because the bind source always exists.
    restart: unless-stopped
